<script>
    document.addEventListener("DOMContentLoaded", () => {
        // Função para buscar o JSON externo
        fetch('database.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Falha ao carregar o banco de dados JSON');
                }
                return response.json();
            })
            .then(database => {
                // Injeta Título e Autores
                document.getElementById('page-title').innerText = database.projectInfo.title;
                document.getElementById('authors-list').innerText = database.projectInfo.authors.join(' & ');

                // Função auxiliar para renderizar os cards em grid
                const renderGrid = (containerId, dataArray, htmlTemplate) => {
                    const container = document.getElementById(containerId);
                    dataArray.forEach(item => {
                        container.innerHTML += htmlTemplate(item);
                    });
                };

                // Renderiza o Sitemap
                const sitemapContainer = document.getElementById('sitemap-container');
                database.siteMap.forEach(item => {
                    const badgeClass = item.status === 'ativo' ? 'badge-active' : 'badge-wip';
                    sitemapContainer.innerHTML += `<div class="sitemap-item">${item.name} <span class="badge ${badgeClass}">${item.status === 'ativo' ? 'Online' : 'Em elaboração'}</span></div>`;
                });

                // Renderiza Terceirização
                renderGrid('outsourcing-container', database.outsourcingStrategies, (item) => `
                    <div class="card">
                        <h3>${item.title}</h3>
                        <p>${item.description}</p>
                    </div>
                `);

                // Renderiza Workflow
                renderGrid('workflow-container', database.workflowSteps, (item) => `
                    <div class="card">
                        <h3>${item.title}</h3>
                        <p>${item.description}</p>
                    </div>
                `);

                // Renderiza Upgrade Roadmap
                renderGrid('upgrade-container', database.upgradeRoadmap, (item) => `
                    <div class="card">
                        <h3>${item.phase}</h3>
                        <div class="card-meta">Referência: ${item.topics}</div>
                        <p>${item.description}</p>
                    </div>
                `);

                // Renderiza Treinamentos
                renderGrid('training-container', database.trainingResources, (item) => `
                    <div class="card">
                        <h3>${item.title}</h3>
                        <p><strong>Foco na Engenharia:</strong> ${item.focus}</p>
                    </div>
                `);
            })
            .catch(error => {
                console.error("Erro:", error);
                document.getElementById('page-title').innerText = "Erro ao carregar os dados. Verifique o database.json.";
            });
    });
</script>
